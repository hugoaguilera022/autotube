services:
  - type: web
    name: autotube
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts && node setup-pot-provider.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: AUTOTUBE_ALLOW_PAID_PROVIDERS
        value: "0"
      - key: AUTOTUBE_ENABLE_FAL_VIDEO
        value: "0"
      - key: AUTOTUBE_ENABLE_REPLICATE_VIDEO
        value: "0"
      - key: AUTOTUBE_LEGACY_VIDEO_FALLBACKS
        value: "1"
      - key: AUTOTUBE_VIDEO_PRIMARY
        value: "fal:seedance-2.5-i2v"
      - key: AUTOTUBE_VIDEO_FALLBACKS
        value: "replicate:wan-2.7-i2v,replicate:seedance-2.5"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: AUTOTUBE_FREE_DAILY_LIMIT
        value: "1"
      - key: AUTOTUBE_MAX_FREE_SCENES
        value: "4"
      - key: AUTOTUBE_MAX_FREE_DURATION_SECONDS
        value: "20"
      - key: AUTOTUBE_DISABLE_LTX
        value: "0"
      - key: LTX_SPACE
        value: "Lightricks/ltx-video-distilled"
