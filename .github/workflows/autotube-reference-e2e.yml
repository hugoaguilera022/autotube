name: AutoTube Reference E2E
on:
  push:
    branches: [main]
jobs:
  reference-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run URL-to-video and inspect MP4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.parse, time
          url='https://www.youtube.com/watch?v=jNQXAC9IVRw'
          base='https://autotube-hfeu.onrender.com'
          req=urllib.request.Request(base+'/api/url-to-video',data=json.dumps({'reference':url}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as r: data=json.load(r)
          print(json.dumps(data,indent=2))
          jid=data.get('jobId')
          if not jid: raise SystemExit('No jobId')
          open('/tmp/jobid','w').write(jid)
          deadline=time.time()+900
          last=''
          while time.time()<deadline:
              time.sleep(5)
              with urllib.request.urlopen(base+'/api/url-to-video/'+urllib.parse.quote(jid),timeout=60) as r: s=json.load(r)
              line=json.dumps(s)
              if line!=last: print(line); last=line
              if s.get('status')=='done': open('/tmp/job.json','w').write(json.dumps(s,indent=2)); break
              if s.get('status')=='error': raise SystemExit('JOB_ERROR: '+str(s))
          else: raise SystemExit('TIMEOUT')
          PY
          python - <<'PY'
          import json, urllib.request
          s=json.load(open('/tmp/job.json')); u='https://autotube-hfeu.onrender.com'+s['downloadUrl']
          with urllib.request.urlopen(u,timeout=180) as r, open('/tmp/autotube.mp4','wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          PY
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate -of json /tmp/autotube.mp4 | tee /tmp/ffprobe.json
          mkdir -p /tmp/frames
          ffmpeg -hide_banner -loglevel error -i /tmp/autotube.mp4 -vf 'fps=1,scale=640:-2' -frames:v 12 /tmp/frames/frame-%02d.jpg
      - name: Compare reference
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq yt-dlp > /dev/null
          yt-dlp --no-playlist -f 'best[ext=mp4]/best' -o '/tmp/reference.%(ext)s' 'https://www.youtube.com/watch?v=jNQXAC9IVRw' || true
          REF=$(find /tmp -maxdepth 1 -type f -name 'reference.*' | head -1 || true)
          if [ -n "$REF" ]; then
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json "$REF" | tee /tmp/reference-ffprobe.json
            mkdir -p /tmp/reference-frames
            ffmpeg -hide_banner -loglevel error -i "$REF" -vf 'fps=1,scale=640:-2' -frames:v 12 /tmp/reference-frames/frame-%02d.jpg || true
          else echo REFERENCE_DOWNLOAD=NO_VERIFICABLE; fi
      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autotube-reference-e2e
          path: |
            /tmp/autotube.mp4
            /tmp/ffprobe.json
            /tmp/job.json
            /tmp/frames/**
            /tmp/reference-ffprobe.json
            /tmp/reference-frames/**
          if-no-files-found: warn
          retention-days: 1