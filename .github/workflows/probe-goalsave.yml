name: Probe alternate LTX provider
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-goalsave.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm init -y && npm install --no-save @gradio/client@latest
      - run: |
          node <<'NODE'
          const {Client}=require('@gradio/client');
          (async()=>{
            const app=await Client.connect('Goalsave/ltx-2-5-studio');
            const api=await app.view_api();
            console.log(JSON.stringify(api,null,2));
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
