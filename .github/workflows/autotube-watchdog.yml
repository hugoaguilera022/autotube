name: AutoTube autonomous watchdog

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: autotube-watchdog
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Keep one canonical E2E moving
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          for tick in $(seq 1 5); do
            echo "=== AutoTube watchdog tick $tick/5 ==="
            runs="$(gh run list --repo "$REPOSITORY" --limit 50 --json databaseId,workflowName,status,conclusion,createdAt,updatedAt)"

            echo "$runs" | jq -r '.[] | [.databaseId,.workflowName,.status,.conclusion,.createdAt,.updatedAt] | @tsv' | sed -n '1,20p'

            now="$(date -u +%s)"
            stale_cancelled=0

            # A canonical E2E run is stale when queued/pending for >=10m or
            # in progress for >=30m. This is deliberately independent of
            # application stage progress so the watchdog can always recover.
            while IFS=$'\t' read -r id created updated; do
              [ -n "$id" ] || continue
              created_ts="$(date -d "$created" +%s 2>/dev/null || echo "$now")"
              updated_ts="$(date -d "$updated" +%s 2>/dev/null || echo "$created_ts")"
              age=$((now-created_ts))
              idle=$((now-updated_ts))

              # Queued/pending runs have no stage progress, so 10m is enough.
              # In-progress generation can legitimately take much longer; only cancel
              # it after 30m from creation, not after a short idle interval.
              status="$(echo "$runs" | jq -r --arg id "$id" '.[] | select((.databaseId|tostring)==$id) | .status')"
              stale=0
              if [ "$status" = "pending" ] || [ "$status" = "queued" ]; then
                [ "$age" -ge 600 ] && stale=1
              elif [ "$status" = "in_progress" ]; then
                [ "$age" -ge 1800 ] && stale=1
              fi
              if [ "$stale" -eq 1 ]; then
                echo "Cancelling stale canonical run $id (status=$status age=${age}s idle=${idle}s)."
                if gh run cancel "$id" --repo "$REPOSITORY" --force; then
                  stale_cancelled=1
                else
                  echo "Normal cancellation failed; retrying via API."
                  gh api --method POST "/repos/$REPOSITORY/actions/runs/$id/cancel" || true
                fi
              fi
            done < <(
              echo "$runs" |
                jq -r '
                  .[]
                  | select(
                      .workflowName=="AutoTube real YouTube to MP4 E2E"
                      and (
                        .status=="pending"
                        or .status=="queued"
                        or (.status=="in_progress" and ((now | tonumber) - (.createdAt | fromdateiso8601) >= 1800))
                      )
                    )
                  | [.databaseId,.createdAt,.updatedAt] | @tsv
                '
            )

            if [ "$stale_cancelled" -eq 1 ]; then
              for wait in 1 2 3 4 5; do
                sleep 3
                runs="$(gh run list --repo "$REPOSITORY" --limit 50 --json databaseId,workflowName,status,conclusion,createdAt,updatedAt)"
                remaining="$(echo "$runs" | jq '[.[] | select(.workflowName=="AutoTube real YouTube to MP4 E2E" and (.status=="pending" or .status=="queued" or .status=="in_progress"))] | length')"
                [ "$remaining" -eq 0 ] && break
              done
            fi

            # There must be one owner of generation/recovery. Cancel legacy or
            # duplicate workflows, but never cancel this watchdog, the canonical
            # E2E, bounded self-heal/repair, or the supervisor.
            while read -r id; do
              [ -n "$id" ] || continue
              gh run cancel "$id" --repo "$REPOSITORY" || true
            done < <(
              echo "$runs" |
                jq -r '
                  .[]
                  | select(
                      (.status=="in_progress" or .status=="queued" or .status=="pending")
                      and (
                        .workflowName!="AutoTube real YouTube to MP4 E2E"
                        and .workflowName!="AutoTube bounded self-heal"
                        and .workflowName!="AutoTube bounded autonomous repair"
                        and .workflowName!="AutoTube autonomous watchdog"
                        and .workflowName!="AutoTube 24h supervisor"
                        and .workflowName!="AutoTube post-change verifier"
                        and .workflowName!="AutoTube Render autonomous repair"
                        and .workflowName!="AutoTube Render deploy self-heal"
                        and .workflowName!="AutoTube Render E2E"
                        and .workflowName!="AutoTube regeneration validation"
                      )
                    )
                  | .databaseId
                '
            )

            canonical="$(echo "$runs" | jq '[.[] | select(.workflowName=="AutoTube real YouTube to MP4 E2E" and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')"
            heal="$(echo "$runs" | jq '[.[] | select((.workflowName=="AutoTube bounded self-heal" or .workflowName=="AutoTube bounded autonomous repair") and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')"
            render_repair="$(echo "$runs" | jq '[.[] | select(.workflowName=="AutoTube Render autonomous repair" and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')"

            # The Render repair loop is an independent owner of production recovery.
            # Keep it alive from the watchdog instead of relying only on its cron.
            # This closes the gap where a failed Render deploy or LIVE runtime error
            # could otherwise wait for a scheduled tick.
            if [ "$render_repair" -eq 0 ]; then
              echo "No Render autonomous repair run is active; dispatching one."
              gh workflow run autotube-render-autorepair.yml --repo "$REPOSITORY" --ref main || true
            else
              echo "Render autonomous repair is already active; no overlap."
            fi

            if [ "$canonical" -eq 0 ] && [ "$heal" -eq 0 ]; then
              echo "No canonical pipeline or recovery is active; dispatching canonical E2E."
              gh workflow run autotube-e2e.yml --repo "$REPOSITORY" --ref main
            else
              echo "Canonical pipeline/recovery is active; no overlap."
            fi

            if [ "$tick" -lt 5 ]; then
              sleep 60
            fi
          done
