name: AutoTube autonomous watchdog

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: autotube-watchdog
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Keep one canonical E2E moving
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for tick in $(seq 1 5); do
            echo "=== AutoTube watchdog tick $tick/5 ==="
            runs="$(gh run list --repo "$REPOSITORY" --limit 50 --json databaseId,workflowName,status,conclusion,createdAt,updatedAt)"
            echo "$runs" | jq -r '.[] | [.databaseId,.workflowName,.status,.conclusion,.createdAt,.updatedAt] | @tsv' | sed -n '1,20p'

            # Recover a stale pending canonical run caused by a previous concurrency lock.
            now="$(date -u +%s)"
            while IFS=$'\t' read -r id created; do
              if [ -z "$id" ]; then
                continue
              fi
              created_ts="$(date -d "$created" +%s 2>/dev/null || echo "$now")"
              age=$((now-created_ts))
              if [ "$age" -ge 600 ]; then
                echo "Cancelling stale pending canonical run $id after ${age}s."
                gh run cancel "$id" --repo "$REPOSITORY" --force || true
              fi
            done < <(echo "$runs" | jq -r '.[] | select(.workflowName=="AutoTube real YouTube to MP4 E2E" and .status=="pending") | [.databaseId,.createdAt] | @tsv')

            sleep 3
            runs="$(gh run list --repo "$REPOSITORY" --limit 50 --json databaseId,workflowName,status,conclusion,createdAt,updatedAt)"

            # Cancel unrelated generation/recovery workflows so there is one owner.
            while read -r id; do
              if [ -z "$id" ]; then
                continue
              fi
              gh run cancel "$id" --repo "$REPOSITORY" || true
            done < <(echo "$runs" | jq -r '.[] | select((.status=="in_progress" or .status=="queued" or .status=="pending") and (.workflowName!="AutoTube real YouTube to MP4 E2E" and .workflowName!="AutoTube bounded self-heal" and .workflowName!="AutoTube bounded autonomous repair" and .workflowName!="AutoTube autonomous watchdog" and .workflowName!="AutoTube 24h supervisor")) | .databaseId')

            canonical="$(echo "$runs" | jq '[.[] | select(.workflowName=="AutoTube real YouTube to MP4 E2E" and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')"
            heal="$(echo "$runs" | jq '[.[] | select((.workflowName=="AutoTube bounded self-heal" or .workflowName=="AutoTube bounded autonomous repair") and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')"

            if [ "$canonical" -eq 0 ] && [ "$heal" -eq 0 ]; then
              echo "No canonical pipeline or recovery is active; dispatching canonical E2E."
              gh api --method POST "/repos/$REPOSITORY/actions/workflows/367417060/dispatches" -f ref=main
            else
              echo "Canonical pipeline/recovery is active; no overlap."
            fi

            if [ "$tick" -lt 5 ]; then
              sleep 60
            fi
          done
