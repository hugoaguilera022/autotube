name: YouTube reference acquisition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install -U yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          yt-dlp --version
      - name: Download exact reference
        env:
          URL: https://youtu.be/mh48xOkLhgU?si=FxdwPeg3v2TMmo_H
        run: |
          mkdir -p /tmp/ref
          python -m pip install -U yt-dlp
          success=0
          for strategy in \
            'tv|best[ext=mp4]/18' \
            'web_embedded|bestvideo*+bestaudio/best' \
            'web_safari|bestvideo*+bestaudio/best' \
            'android_vr|18/best[ext=mp4]'; do
            client="${strategy%%|*}"
            format="${strategy#*|}"
            echo "Trying YouTube client: $client"
            rm -f /tmp/ref/reference.*
            if python -m yt_dlp --js-runtimes node --remote-components ejs:github \
              --extractor-args "youtube:player_client=$client;player_skip=webpage,configs" \
              --format "$format" --merge-output-format mp4 --no-playlist --force-ipv4 \
              --retries 10 --fragment-retries 10 --concurrent-fragments 1 \
              -o "/tmp/ref/reference.%(ext)s" "$URL"; then
              if test -s /tmp/ref/reference.mp4; then
                success=1
                echo "SUCCESS with $client"
                break
              fi
            fi
          done
          test "$success" = 1
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,avg_frame_rate,codec_type \
            -of json /tmp/ref/reference.mp4 | tee /tmp/ref/probe.json
          test "$(stat -c%s /tmp/ref/reference.mp4)" -gt 100000
      - name: Publish reference artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete autotube-reference-test --yes || true
          gh release create autotube-reference-test /tmp/ref/reference.mp4 \
            --title "AutoTube reference test" --notes "Real YouTube reference used by AutoTube E2E"
