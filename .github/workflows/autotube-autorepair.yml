name: AutoTube autonomous code repair
on:
  workflow_run:
    workflows: ["AutoTube real YouTube to MP4 E2E"]
    types: [completed]
permissions:
  actions: write
  contents: write
  issues: write
jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt >= 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Repair failed canonical E2E
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/autotube-autorepair.sh
