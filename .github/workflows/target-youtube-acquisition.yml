name: AutoTube target YouTube acquisition
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render
        run: |
          set -e
          for i in $(seq 1 180); do
            h=$(curl -fsS https://autotube-hfeu.onrender.com/api/health || true)
            commit=$(printf '%s' "$h" | python -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ -n "$commit" ]; then
              status=$(curl -fsS "https://api.github.com/repos/hugoaguilera022/autotube/compare/$GITHUB_SHA...$commit" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
              if [ "$status" = "identical" ] || [ "$status" = "ahead" ]; then
                echo "$h"
                sleep 20
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Render did not deploy the tested commit or a descendant"
          exit 1
      - name: Download target through AutoTube
        run: |
          set -e
          u='https://www.youtube.com/watch?v=mh48xOkLhgU'
          r=$(curl -fsS --max-time 60 -X POST https://autotube-hfeu.onrender.com/api/url-to-mp4 -H 'Content-Type: application/json' --data "{\"reference\":\"$u\"}")
          echo "$r"
          j=$(printf '%s' "$r" | python -c 'import json,sys; print(json.load(sys.stdin)[\"jobId\"])')
          for i in $(seq 1 120); do
            s=$(curl -sS https://autotube-hfeu.onrender.com/api/url-to-mp4/$j); echo "$s"
            st=$(printf '%s' "$s" | python -c 'import json,sys; print(json.load(sys.stdin).get(\"status\",\"\"))' 2>/dev/null || true)
            if [ "$st" = done ]; then exit 0; fi
            if [ "$st" = error ]; then exit 1; fi
            sleep 5
          done
          exit 1
