name: AutoTube real recreation via authenticated HF browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/real-ai-generation-test.yml']

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm init -y && npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Generate real clips through HF browser quota
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.goto('https://huggingface.co/spaces/akhaliq/LTX-2.5-workflow',{waitUntil:'domcontentloaded',timeout:180000});
            await p.waitForTimeout(15000);
            const frames=p.frames().map(f=>({url:f.url(),name:f.name()}));
            console.log(JSON.stringify(frames,null,2));
            const hf= p.frames().find(f=>f.url().includes('.hf.space'));
            if(!hf) throw Error('HF Space iframe not found');
            const result=await hf.evaluate(async()=>{
              window.supports_zerogpu_headers=true;
              const s=document.createElement('script');s.type='module';s.textContent='';
              const mod=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');
              const client=await mod.Client.connect(location.hostname.replace(/\.hf\.space$/,'').replace(/-/g,'/').replace(/^/,'')); 
              return {ok:true,api:await client.view_api()};
            });
            console.log(JSON.stringify(result,null,2));
            await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
