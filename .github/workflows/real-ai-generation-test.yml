name: AutoTube real AI generation test

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - '.github/workflows/real-ai-generation-test.yml'
  workflow_dispatch:

jobs:
  real-ltx-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real browser/ZeroGPU execution; no synthetic video fallback.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Render deployment
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" https://autotube-hfeu.onrender.com/api/health || true)
            echo "health HTTP $code"
            cat /tmp/health.json || true
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Render did not become healthy"
          exit 1

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute real LTX generation in browser
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            page.on('console', m => console.log('[browser]', m.type(), m.text()));
            page.on('pageerror', e => console.log('[pageerror]', e.message));
            await page.goto('https://autotube-hfeu.onrender.com/video-ai-test-browser', {waitUntil:'domcontentloaded', timeout:120000});
            await page.screenshot({path:'/tmp/ltx-before.png', fullPage:true});
            await page.getByRole('button', {name:/Generar clip HD de prueba/i}).click();
            await page.waitForFunction(() => {
              const v=document.querySelector('video');
              return !!(v && v.src);
            }, null, {timeout: 600000});
            const src=await page.locator('video').getAttribute('src');
            if(!src) throw new Error('LTX did not return a video URL');
            console.log('LTX output URL received');
            const response=await page.request.get(src);
            if(!response.ok()) throw new Error('Could not download generated LTX video: '+response.status());
            const body=await response.body();
            if(body.length < 10000) throw new Error('Generated LTX video is unexpectedly small: '+body.length);
            fs.writeFileSync('/tmp/ltx-generated.mp4', body);
            await page.screenshot({path:'/tmp/ltx-after.png', fullPage:true});
            console.log('Generated bytes:', body.length);
            await browser.close();
          })().catch(async e => { console.error(e.stack || e); process.exit(1); });
          NODE

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate generated MP4
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,bit_rate,sample_rate,channels -of json /tmp/ltx-generated.mp4 | tee /tmp/ltx-probe.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ltx-probe.json'))
          streams=d["streams"]
          v=next(s for s in streams if s.get("codec_name"))
          assert int(v.get("width",0)) > 0 and int(v.get("height",0)) > 0
          assert float(d["format"]["duration"]) >= 2.5
          print("REAL LTX GENERATION: PASS")
          PY

      - name: Upload real generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotube-real-ltx-generation
          path: |
            /tmp/ltx-generated.mp4
            /tmp/ltx-probe.json
            /tmp/ltx-before.png
            /tmp/ltx-after.png
