name: Probe Goalsave app domain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-goalsave-test.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:1000}});await p.goto('https://goalsave-ltx-2-5-studio.hf.space',{waitUntil:'domcontentloaded',timeout:120000});console.log('TITLE',await p.title());console.log('BUTTONS',await p.locator('button').allTextContents());console.log('TEXT', (await p.locator('body').innerText()).slice(0,8000));await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
