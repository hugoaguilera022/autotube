name: Check HF generation secret presence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-hf-secret.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then echo "HF_TOKEN_PRESENT=true"; else echo "HF_TOKEN_PRESENT=false"; fi
