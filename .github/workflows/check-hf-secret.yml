name: Check HF token aliases
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-hf-secret.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.HF_TOKEN }}
          B: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          echo "HF_TOKEN_PRESENT=$([ -n "$A" ] && echo true || echo false)"
          echo "HUGGINGFACE_TOKEN_PRESENT=$([ -n "$B" ] && echo true || echo false)"
