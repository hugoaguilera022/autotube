name: AutoTube real YouTube to MP4 E2E

on:
  workflow_dispatch:

concurrency:
  group: autotube-e2e-canonical
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for Render to deploy this commit
        env:
          BASE_URL: https://autotube-usm1.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            body="$(curl -fsS --max-time 15 "$BASE_URL/api/health" || true)"
            commit="$(printf '%s' "$body" | jq -r '.commit // empty')"
            echo "Render commit: $commit"
            if [ "$commit" = "$EXPECTED_COMMIT" ]; then
              echo "Render is serving this exact commit."
              exit 0
            fi
            sleep 10
          done
          echo "Render did not serve $EXPECTED_COMMIT in time." >&2
          exit 1

      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq curl

      - name: Run sequential real reference-to-MP4 attempts
        env:
          BASE_URL: https://autotube-usm1.onrender.com
          REFERENCE: https://www.youtube.com/watch?v=P_iFWenf1VA
          MAX_ATTEMPTS: "1"
        run: |
          set -uo pipefail
          success=0
          last_error=""
          # Intermediate retries stay suppressed once the pipeline reaches a validated
          # checkpoint. Only the final E2E proof re-runs the complete pipeline.
          # A failure still exits non-zero so the autonomous self-heal/repair cycle can
          # diagnose the actual failing stage instead of masking it with blind retries.
          echo "CHECKPOINT POLICY: no blind intermediate retries; final E2E is the full proof."
          echo "CHECKPOINT-AWARE MODE: cada nueva llamada al pipeline reutiliza los stages ya validados en Render cuando el checkpoint siga disponible."

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "============================================================"
            echo "AUTOTUBE E2E ATTEMPT $attempt/$MAX_ATTEMPTS"
            echo "============================================================"

            rm -f start.json status.json autotube-final.mp4 ffprobe.json

            if ! curl -fsS --max-time 60 --get               --data-urlencode "reference=$REFERENCE"               "$BASE_URL/api/full-pipeline-test" > start.json; then
              last_error="Could not start pipeline"
              echo "$last_error"
            else
              cat start.json
              job="$(jq -r '.jobId // empty' start.json 2>/dev/null || true)"

              if [ -z "$job" ]; then
                last_error="Pipeline did not return a jobId"
                echo "$last_error"
              else
                state="unknown"
                for poll in $(seq 1 720); do
                  status="$(curl -fsS --max-time 30 "$BASE_URL/api/full-pipeline-test/$job" || true)"
                  printf '%s\n' "$status" > status.json
                  echo "$status" | jq '{status,ok,elapsedMs,currentStage,progress,stageElapsedMs,providerBudget,zeroGpuQuotaCooldownUntil,result:.result,error}' || true
                  state="$(echo "$status" | jq -r '.status // empty' 2>/dev/null || true)"

                  if [ "$state" = "done" ]; then
                    echo "Pipeline reported done."
                    break
                  fi

                  elapsed="$(echo "$status" | jq -r '.elapsedMs // 0' 2>/dev/null || echo 0)"
                  if [ "$state" = "running" ] && [ "$poll" -ge 60 ]; then
                    stage="$(echo "$status" | jq -r '.currentStage // "unknown"' 2>/dev/null || echo unknown)"
                    stage_elapsed="$(echo "$status" | jq -r '.stageElapsedMs // 0' 2>/dev/null || echo 0)"
                    if [ "$stage" = "visual-sources-all-scenes" ] && [ "$stage_elapsed" -lt 480000 ]; then
                      echo "GENERATION STILL ACTIVE: visual AI stage is within its 8-minute stage budget; do not classify as stalled."
                    else
                      last_error="Pipeline remained running beyond its allowed stage budget: stage=$stage stageElapsedMs=$stage_elapsed"
                      echo "$last_error"
                      break
                    fi
                  fi

                  if [ "$state" = "failed" ] ||                      { [ "$state" != "running" ] &&                        [ "$(echo "$status" | jq -r '.ok // true' 2>/dev/null || true)" = "false" ]; }; then
                    last_error="$(echo "$status" | jq -r '.error // .message // "pipeline failed"' 2>/dev/null || echo "pipeline failed")"
                    echo "Detected pipeline failure: $last_error"
                    break
                  fi

                  sleep 10
                done

                if [ "$state" = "done" ]; then
                  echo "Downloading candidate MP4 for strict validation..."
                  if curl -fL --max-time 1800                     "$BASE_URL/api/full-pipeline-test/$job/download"                     -o autotube-final.mp4; then

                    if [ -s autotube-final.mp4 ]; then
                      if ffprobe -v error                         -show_entries format=duration,size                         -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels                         -of json autotube-final.mp4 > ffprobe.json; then

                        cat ffprobe.json
                        has_video="$(jq -r '[.streams[] | select(.codec_type=="video")] | length' ffprobe.json)"
                        has_audio="$(jq -r '[.streams[] | select(.codec_type=="audio")] | length' ffprobe.json)"
                        duration="$(jq -r '.format.duration // 0' ffprobe.json)"
                        size="$(jq -r '.format.size // 0' ffprobe.json)"

                        if [ "$has_video" -ge 1 ] && [ "$has_audio" -ge 1 ] &&                            awk "BEGIN {exit !($duration > 0)}" &&                            awk "BEGIN {exit !($size > 10000)}"; then
                          echo "Basic MP4 container validation passed."

                          reference_ok="$(jq -r '.result.validation.referenceSimilarityValidation.accepted // false' status.json 2>/dev/null || echo false)"
                          if [ "$reference_ok" != "true" ]; then
                            last_error="Final MP4 did not pass audiovisual similarity validation against the YouTube reference"
                            echo "$last_error"
                            continue
                          fi
                          echo "REFERENCE VALIDATION PASSED: generated MP4 matches the reference audiovisual profile."

                          # Require measurable frame-to-frame visual change.
                          motion="$(ffmpeg -hide_banner -loglevel error                             -i autotube-final.mp4                             -vf "select='gt(scene,0.003)',metadata=print:file=motion.txt"                             -an -f null - 2>&1 || true)"
                          frames="$(grep -c "lavfi.scene_score" motion.txt 2>/dev/null || true)"

                          if [ "${frames:-0}" -ge 1 ]; then
                            echo "STRICT VALIDATION PASSED: real frame-to-frame motion detected."
                            echo "AUTOTUBE_FINAL_MP4_VALID=1"
                            echo "AUTOTUBE_FINAL_MP4_MOTION=1"
                            success=1
                            break
                          fi

                          last_error="MP4 exists but strict motion validation found no measurable frame-to-frame change"
                          echo "$last_error"
                        else
                          last_error="MP4 failed container validation"
                          echo "$last_error"
                        fi
                      else
                        last_error="ffprobe could not parse the MP4"
                        echo "$last_error"
                      fi
                    else
                      last_error="Downloaded MP4 is empty"
                      echo "$last_error"
                    fi
                  else
                    last_error="Could not download final MP4"
                    echo "$last_error"
                  fi
                fi
              fi
            fi

            if [ "$success" -eq 1 ]; then
              break
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "A retry would be allowed only by an explicit repaired/final E2E run; no blind retry is performed here."
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "AUTOTUBE_E2E_FAILED_AFTER_RETRIES=1" >&2
            echo "Last detected failure: $last_error" >&2
            exit 1
          fi

      - name: Upload verified MP4 and diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autotube-verified-mp4-${{ github.sha }}
          path: |
            autotube-final.mp4
            status.json
            ffprobe.json
            start.json
            motion.txt
          retention-days: 7

      - name: Notify final validated MP4
        if: success()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: hugoaguilera022@gmail.com
        run: |
          set -euo pipefail
          if [ -z "${BREVO_API_KEY:-}" ]; then
            echo "BREVO_API_KEY is not configured; artifact remains available in this run."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          run_url = os.environ.get("GITHUB_SERVER_URL","https://github.com") + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          payload = {
            "sender": {"name":"AutoTube","email":"hugoaguilera022@gmail.com"},
            "to": [{"email": os.environ["ALERT_EMAIL"]}],
            "subject": "✅ AutoTube MP4 final validado",
            "textContent": "✅ El MP4 final de AutoTube ha sido generado y ha superado la validación estricta de vídeo IA real (incluido movimiento entre frames).\n\nRun: " + run_url
          }
          req=urllib.request.Request("https://api.brevo.com/v3/smtp/email", data=json.dumps(payload).encode(), headers={"accept":"application/json","api-key":os.environ["BREVO_API_KEY"],"content-type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r:
              print(r.read().decode())
          PY
