name: AutoTube real YouTube to MP4 E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: autotube-finalization
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Wait for Render to deploy this commit
        env:
          BASE_URL: https://autotube-usm1.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            body="$(curl -fsS --max-time 15 "$BASE_URL/api/health" || true)"
            commit="$(printf '%s' "$body" | jq -r '.commit // empty')"
            echo "Render commit: $commit"
            if [ "$commit" = "$EXPECTED_COMMIT" ]; then exit 0; fi
            sleep 10
          done
          echo "Render did not serve $EXPECTED_COMMIT in time." >&2
          exit 1

      - name: Run one real reference-to-MP4 pipeline
        env:
          BASE_URL: https://autotube-usm1.onrender.com
          REFERENCE: https://www.youtube.com/watch?v=P_iFWenf1VA
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 --get --data-urlencode "reference=$REFERENCE" "$BASE_URL/api/full-pipeline-test" > start.json
          cat start.json
          job="$(jq -r '.jobId // empty' start.json)"
          test -n "$job"
          for i in $(seq 1 720); do
            status="$(curl -fsS --max-time 30 "$BASE_URL/api/full-pipeline-test/$job" || true)"
            printf '%s
' "$status" > status.json
            echo "$status" | jq '{status,ok,elapsedMs,result: .result,error}' || true
            state="$(echo "$status" | jq -r '.status // empty' 2>/dev/null || true)"
            if [ "$state" = "done" ]; then exit 0; fi
            if [ "$state" = "failed" ] || { [ "$state" != "running" ] && [ "$(echo "$status" | jq -r '.ok // true' 2>/dev/null || true)" = "false" ]; }; then
              exit 1
            fi
            sleep 10
          done
          echo "E2E timed out." >&2
          exit 1

      - name: Download and strictly validate final MP4
        if: success()
        env:
          BASE_URL: https://autotube-usm1.onrender.com
        run: |
          set -euo pipefail
          job="$(jq -r '.jobId' start.json)"
          curl -fL --max-time 1800 "$BASE_URL/api/full-pipeline-test/$job/download" -o autotube-final.mp4
          test -s autotube-final.mp4
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json autotube-final.mp4 > ffprobe.json
          cat ffprobe.json
          jq -e '.streams | map(select(.codec_type=="video")) | length >= 1' ffprobe.json
          jq -e '.streams | map(select(.codec_type=="audio")) | length >= 1' ffprobe.json
          jq -e '.format.duration | tonumber > 0' ffprobe.json
          jq -e '.format.size | tonumber > 10000' ffprobe.json
          echo "AUTOTUBE_FINAL_MP4_VALID=1"

      - name: Upload verified MP4 and reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autotube-verified-mp4-${{ github.sha }}
          path: |
            autotube-final.mp4
            status.json
            ffprobe.json
            start.json
          retention-days: 7
