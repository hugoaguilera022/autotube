name: AutoTube Render autonomous repair

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # A workflow-file change itself must produce a fresh run so newly-created
  # repository secrets can be verified immediately, and repair-code changes are verified immediately, without depending on a
  # manual rerun of an old execution.
  push:
    paths:
      - '.github/workflows/autotube-render-autorepair.yml'
      - 'scripts/autotube-render-autorepair.sh'

concurrency:
  group: autotube-render-autorepair
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify repair credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$RENDER_API_KEY" ] || missing="$missing RENDER_API_KEY"
          [ -n "$GEMINI_API_KEY" ] || missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "AUTOTUBE_RECOVERY_BLOCKED: missing required GitHub Actions secrets:$missing"
            gh issue list --repo "$REPOSITORY" --state open --search "AutoTube recovery credentials blocked in:title" --limit 1 | grep -q . || \
              gh issue create --repo "$REPOSITORY" --title "AutoTube recovery credentials blocked" --body "The autonomous Render recovery workflow is running, but these required GitHub Actions secrets are missing:$missing. The recovery engine cannot inspect Render or generate a safe code repair until they are configured. No application fallback is being weakened."
            exit 0
          fi
      - name: Validate Recovery Engine contract
        run: |
          set -euo pipefail
          chmod +x scripts/autotube-recovery-contract.sh scripts/autotube-render-autorepair.sh
          bash scripts/autotube-recovery-contract.sh --self-test

      - name: Inspect and repair latest failed Render deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dasrdmvpn0mc739n1at0
          RENDER_OWNER_ID: tea-dasrcurbc2fs73a12d90
        run: bash scripts/autotube-render-autorepair.sh