name: Fix LTX quality
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified LTX multi-scale setting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text()
          old="3,false,false]);"
          new="3,true,false]);"
          if old not in s:
              raise SystemExit('Expected LTX call not found; no change made')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git rm .github/workflows/fix-ltx-quality.yml
          git commit -m "Enable LTX multi-scale quality"
          git push
