name: AutoTube authenticated real LTX test
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - '.github/workflows/h3-real-test.yml'
  workflow_dispatch:
jobs:
  authenticated-ltx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Render
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /tmp/h -w "%{http_code}" https://autotube-hfeu.onrender.com/api/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
      - name: Execute authenticated LTX batch on Render
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();
          await p.goto('https://autotube-hfeu.onrender.com/video-ai-test-browser?batch=0',{waitUntil:'domcontentloaded',timeout:120000});
          await p.waitForFunction(()=>window.__out||window.__error||window.__done,null,{timeout:900000});
          const e=await p.evaluate(()=>window.__error||'');if(e)throw Error(e);
          const u=await p.evaluate(()=>window.__outputs||[]);if(u.length!==4)throw Error('Expected 4 authenticated clips, got '+u.length);
          for(let i=0;i<u.length;i++){const r=await p.request.get(u[i]);if(!r.ok())throw Error('download '+r.status());const body=await r.body();fs.writeFileSync('/tmp/clip-'+i+'.mp4',body);console.log('CLIP',i,'BYTES',body.length)}
          await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Validate
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          for f in /tmp/clip-*.mp4; do ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json "$f"; done
          echo "AUTHENTICATED LTX BATCH: PASS"
