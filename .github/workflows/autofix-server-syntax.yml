name: Auto-fix server.js escaped newlines

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped newline corruption
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("server.js")
          s = p.read_text()
          old = s
          replacements = {
              r";\n  const order=allocationProviderOrder": ";
  const order=allocationProviderOrder",
              r"\nfunction requiredVideoResourceSeconds(){": "
function requiredVideoResourceSeconds(){",
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          if s == old:
              print("No escaped-newline corruption found.")
              raise SystemExit(0)
          p.write_text(s)
          print("Repaired escaped newline corruption in server.js")
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair escaped newline syntax corruption"
          git push
