name: AutoTube E2E live regeneration test
on:
  workflow_dispatch:
concurrency:
  group: autotube-ai-e2e
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for Render
        run: |
          set -e
          for i in $(seq 1 90); do
            curl -fsS --max-time 10 https://autotube-verify.onrender.com/api/health -o health.json && cat health.json && exit 0
            sleep 5
          done
          exit 1
      - name: Notice
        run: echo "Use clean-ai-proof.yml for the single automated proof run."
