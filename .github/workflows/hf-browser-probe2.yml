name: HF browser LTX probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hf-browser-probe2.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm init -y && npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.goto('https://huggingface.co/spaces/akhaliq/LTX-2.5-workflow',{waitUntil:'domcontentloaded',timeout:180000});
            await p.waitForTimeout(12000);
            console.log('FRAMES',JSON.stringify(p.frames().map(f=>f.url()),null,2));
            const hf=p.frames().find(f=>f.url().includes('.hf.space'));
            if(!hf) throw Error('NO_HF_IFRAME');
            const out=await hf.evaluate(async()=>{
              window.supports_zerogpu_headers=true;
              const {Client}=await import('https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js');
              const c=await Client.connect(location.origin);
              return await c.view_api();
            });
            console.log('API',JSON.stringify(out,null,2));
            await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE