name: AutoTube Render deploy self-heal

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  render-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and repair failed Render deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dasrdmvpn0mc739n1at0
          RENDER_OWNER_ID: tea-dasrcurbc2fs73a12d90
        run: bash scripts/autotube-render-autorepair.sh
