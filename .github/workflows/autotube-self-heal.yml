name: AutoTube bounded self-heal

on:
  workflow_run:
    workflows: ["AutoTube real YouTube to MP4 E2E"]
    types: [completed]

concurrency:
  group: autotube-finalization
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  retry-transient-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry only failed E2E jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Self-heal attempt ${{ github.event.workflow_run.run_attempt }} for run $RUN_ID"
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"

  report-exhausted-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt >= 3 }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create one diagnostic issue after bounded retries
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh issue create \
            --repo "$REPOSITORY" \
            --title "AutoTube E2E failed after automatic retries" \
            --body "The canonical E2E failed after 3 attempts. Automatic retries are exhausted. Run: $RUN_URL"
