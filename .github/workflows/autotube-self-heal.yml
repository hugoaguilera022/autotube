name: AutoTube bounded self-heal

on:
  workflow_run:
    workflows: ["AutoTube real YouTube to MP4 E2E"]
    types: [completed]

concurrency:
  group: autotube-self-heal
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  retry-transient-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry only failed E2E jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Self-heal attempt ${{ github.event.workflow_run.run_attempt }} for run $RUN_ID"
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"

  report-exhausted-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt >= 3 }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create one diagnostic issue after bounded retries
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh issue create \
            --repo "$REPOSITORY" \
            --title "AutoTube E2E failed after automatic retries" \
            --body "The canonical E2E failed after 3 attempts. Automatic retries are exhausted. Run: $RUN_URL"

      - name: Notify only when user intervention is required
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: hugoaguilera022@gmail.com
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$BREVO_API_KEY"
          python - <<'PY'
          import json, os, urllib.request
          payload = {
            "sender": {"name": "AutoTube", "email": "hugoaguilera022@gmail.com"},
            "to": [{"email": os.environ["ALERT_EMAIL"]}],
            "subject": "🚨 AutoTube necesita tu ayuda",
            "textContent": (
              "🚨 NECESITAMOS TU AYUDA‼️\n\n"
              "AutoTube ha agotado sus 3 intentos automáticos de recuperación. "
              "Necesita una intervención manual.\n\n"
              f"Intento final: {os.environ['ATTEMPT']}\n"
              f"Run: {os.environ['RUN_URL']}\n"
            )
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
            "https://api.brevo.com/v3/smtp/email",
            data=data,
            headers={
              "accept": "application/json",
              "api-key": os.environ["BREVO_API_KEY"],
              "content-type": "application/json",
            },
            method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
            print(resp.read().decode("utf-8"))
          PY
