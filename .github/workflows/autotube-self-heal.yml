name: AutoTube bounded self-heal

on:
  workflow_run:
    workflows: ["AutoTube real YouTube to MP4 E2E"]
    types: [completed]

concurrency:
  group: autotube-self-heal
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  retry-transient-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Diagnose failed E2E before retrying
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log > failure.log || true
          tail -n 1800 failure.log > failure-tail.log
          echo "Self-heal diagnosis for attempt ${{ github.event.workflow_run.run_attempt }}"
          if grep -Eiq 'user.?action|required.*login|sign in to confirm|authentication required|OAuth|permission denied' failure-tail.log; then
            echo "USER-BLOCKING: no retry consumed"
            gh issue create --repo "$REPOSITORY" --title "AutoTube needs user action" --body "E2E run $RUN_ID appears to require user intervention. Self-heal stopped before consuming another retry." || true
            exit 0
          fi
          if grep -Eiq '502|503|504|timeout|timed out|ECONNRESET|ETIMEDOUT|ZeroGPU quota|queue is full|temporarily unavailable|rate.?limit|429' failure-tail.log; then
            echo "TRANSIENT/PROVIDER: rerunning failed jobs"
          else
            echo "STRUCTURAL/UNKNOWN: rerunning once; if it fails a third time Autorepair takes over"
          fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
