name: AutoTube AI reference proof
on:
  push:
    paths:
      - "_e2e-trigger/**"
jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for Render deployment
        run: sleep 120
      - name: Start AI recreation
        id: start
        run: |
          set -euo pipefail
          URL='https://autotube-ai-reference-proof.onrender.com/api/verify-ai-e2e?reference=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D6SUAdxU9CDE'
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/start.json -w '%{http_code}' "$URL" || true)
            cat /tmp/start.json
            if [ "$code" = "202" ]; then break; fi
            sleep 15
          done
          test -s /tmp/start.json
          JOB=$(python -c "import json; print(json.load(open('/tmp/start.json'))['jobId'])")
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
      - name: Poll generation
        run: |
          set -euo pipefail
          JOB='${{ steps.start.outputs.job }}'
          for i in $(seq 1 120); do
            curl -fsS "https://autotube-ai-reference-proof.onrender.com/api/url-to-video/$JOB" | tee /tmp/status.json
            STATUS=$(python -c "import json; print(json.load(open('/tmp/status.json')).get('status',''))")
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "error" ]; then cat /tmp/status.json; exit 1; fi
            sleep 10
          done
          test "$STATUS" = done
          python -c "import json; d=json.load(open('/tmp/status.json')); print(d); assert d.get('downloadUrl')"
      - name: Download and validate final MP4
        run: |
          set -euo pipefail
          JOB='${{ steps.start.outputs.job }}'
          curl -fL --retry 3 "https://autotube-ai-reference-proof.onrender.com/api/url-to-video/$JOB/download" -o autotube-final.mp4
          test -s autotube-final.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate -of json autotube-final.mp4 | tee validation.json
          python - <<'PY'
          import json
          d=json.load(open('validation.json'))
          assert d['format']['size'] and float(d['format']['duration']) > 0
          vs=[x for x in d['streams'] if x.get('codec_type')=='video']
          assert vs and vs[0].get('width') and vs[0].get('height')
          PY
      - name: Upload verified MP4
        uses: actions/upload-artifact@v4
        with:
          name: autotube-final-mp4-proof
          path: |
            autotube-final.mp4
            validation.json
