name: AutoTube MP4 end-to-end test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Start fixed YouTube test
        run: |
          set -e
          BASE="https://autotube-hfeu.onrender.com"
          START="$(curl -fsS --max-time 30 "$BASE/api/url-to-mp4/test")"
          echo "$START"
          JOB="$(echo "$START" | python -c 'import json,sys; print(json.load(sys.stdin)["jobId"])')"
          for i in $(seq 1 180); do
            sleep 5
            S="$(curl -fsS --max-time 30 "$BASE/api/url-to-mp4/$JOB")"
            echo "$S"
            STATUS="$(echo "$S" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            if [ "$STATUS" = "done" ]; then
              echo "AUTOTUBE_MP4_TEST_PASSED"
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "AUTOTUBE_MP4_TEST_FAILED"
              exit 1
            fi
          done
          echo "AUTOTUBE_MP4_TEST_TIMEOUT"
          exit 1
