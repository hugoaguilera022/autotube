name: AI reference MP4 proof

on:
  push:
    branches: [e2e-stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ai-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start AI reference job
        id: start
        env:
          APP_URL: https://autotube-ai-e2e-isolated.onrender.com
          REFERENCE: https://www.youtube.com/watch?v=6SUAdxU9CDE
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 "$APP_URL/api/url-to-video?reference=$(python -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["REFERENCE"], safe=""))')")"
          echo "$response"
          job="$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["jobId"])' <<<"$response")"
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Poll until MP4 is ready
        env:
          APP_URL: https://autotube-ai-e2e-isolated.onrender.com
          JOB: ${{ steps.start.outputs.job }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            body="$(curl -fsS --retry 3 --retry-all-errors --connect-timeout 15 --max-time 30 "$APP_URL/api/url-to-video/$JOB")" || body='{"status":"retry"}'
            echo "$body"
            status="$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("status",""))' <<<"$body" 2>/dev/null || true)"
            if [ "$status" = "done" ]; then
              echo "$body" > job.json
              exit 0
            fi
            if [ "$status" = "error" ]; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Download generated MP4
        env:
          APP_URL: https://autotube-ai-e2e-isolated.onrender.com
          JOB: ${{ steps.start.outputs.job }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 "$APP_URL/api/url-to-video/$JOB/download" -o autotube-ai-reference.mp4
          test -s autotube-ai-reference.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,avg_frame_rate,codec_type -of json autotube-ai-reference.mp4 | tee mp4-probe.json
          test "$(stat -c%s autotube-ai-reference.mp4)" -gt 10000

      - name: Upload validated MP4
        uses: actions/upload-artifact@v4
        with:
          name: autotube-ai-reference-mp4
          path: |
            autotube-ai-reference.mp4
            mp4-probe.json
            job.json
